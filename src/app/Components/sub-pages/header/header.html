<header class="header sticky-top">
  <div class="container-fluid">
    <div class="row header-content">

      <!-- Logo + Toggle -->
      <div class="col-12 col-lg-3 d-flex justify-content-between align-items-center">
        <div class="logo ms-3">
          <img src="assets/images/horizontal_logo.png" alt="Smart Trade" />
        </div>
        <button class="menu-toggle" (click)="toggleMenu()">
          <span [class.open]="isMenuOpen"></span>
          <span [class.open]="isMenuOpen"></span>
          <span [class.open]="isMenuOpen"></span>
        </button>
      </div>

      <!-- Desktop Nav -->
      <div class="col-md-6 d-flex justify-content-center">
       <nav class="nav desktop-nav">
    <a class="nav-link" (click)="scrollTo('hero')">Home</a>
    <a class="nav-link" (click)="scrollTo('about')">About Us</a>
    <a class="nav-link" (click)="scrollTo('courses')">Courses</a>
    <a class="nav-link" (click)="scrollTo('contact')">Contact Us</a>
  </nav>
      </div>

      <!-- Desktop Auth -->
      <div class="col-md-3 d-flex justify-content-center align-items-center">
        <div class="auth-buttons desktop-auth">
          @if(isLoggedIn) {
            @if (showLogout) {
               <button class="btn btn-outline" (click)="onLogout()">Logout</button>
            } @else {
               <button class="account-avatar" routerLink="/subscriptions" title="My Account">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
        </button>
            }
           
          } @else {
            @if(isAuthButton) {
              <button class="btn btn-outline" routerLink="/login">Login</button>
              <button class="btn btn-primary" routerLink="/register">Sign Up</button>
            }
          }
        </div>
      </div>

    </div>
  </div>

  <!-- ✅ Single mobile dropdown panel — nav + auth together -->
  <div class="mobile-menu" [class.open]="isMenuOpen">
    <nav class="mobile-nav">
      <a   (click)="scrollTo('hero')" class="nav-link" >Home</a>
      <a  (click)="scrollTo('about')" class="nav-link" >About Us</a>
      <a  (click)="scrollTo('courses')" class="nav-link" >Courses</a>
      <a  (click)="scrollTo('contact')" class="nav-link" >Contact Us</a>
    </nav>

    <div class="mobile-auth">
      @if(isLoggedIn) {
        @if(showLogout) {
      <button class="btn btn-outline" (click)="onLogout()">Logout</button>
    } @else {
      <button class="btn btn-outline" routerLink="/subscriptions" (click)="closeMenu()">My Account</button>
    }
      } @else {
        @if(isAuthButton) {
          <div class="mobile-auth-btns">
            <button class="btn btn-outline" routerLink="/login" (click)="closeMenu()">Login</button>
            <button class="btn btn-primary" routerLink="/register" (click)="closeMenu()">Sign Up</button>
          </div>
        }
      }
    </div>
  </div>

  <!-- ✅ Backdrop — click outside closes menu -->
  <div class="menu-backdrop" [class.show]="isMenuOpen" (click)="closeMenu()"></div>

</header>
