<div class="container-fluid py-4 wallet-main">
    <div class="row g-4">

       

        <div class="col-lg-5">

           <app-wallet-summary (depositClick)="openDepositModal()"
    (withdrawClick)="openWithdrawModal()" />
       
           <div class="mt-4"><app-trading-notes/></div>
           
        </div>
 <div class="col-lg-7">

         <div> <app-trade-history /> </div>

        </div>
    </div>
</div>


@if(showDepositModal){

<div class="trade-modal"
     (click)="closeDepositModal()">

    <div class="modal-dialog"
         (click)="$event.stopPropagation()">

        <div class="modal-header">

            <h4>Add Deposit</h4>

            <button
                class="close-btn"
                (click)="closeDepositModal()">

                <i class="bi bi-x-lg"></i>

            </button>

        </div>

        <div class="modal-body">

            <form class="deposit-form">

                <div class="form-group">

                    <label>Amount</label>

                    <input
                        type="number"
                        class="form-control"
                        placeholder="Enter amount">

                </div>

                <div class="form-group">

                    <label>Date</label>

                    <input
                        type="date"
                        class="form-control">

                </div>

                <div class="form-group full-width">

                    <label>Notes</label>

                    <textarea
                        rows="4"
                        class="form-control"
                        placeholder="Optional notes">
                    </textarea>

                </div>

            </form>

        </div>

        <div class="modal-footer">

            <button
                class="btn btn-light"
                (click)="closeDepositModal()">

                Cancel

            </button>

            <button
                class="btn btn-primary">

                Save Deposit

            </button>

        </div>

    </div>

</div>

}
@if(showWithdrawModal){

<div
    class="trade-modal"
    (click)="closeWithdrawModal()">

    <div
        class="modal-dialog"
        (click)="$event.stopPropagation()">

        <!-- Header -->

        <div class="modal-header">

            <h4>Withdraw Funds</h4>

            <button
                type="button"
                class="close-btn"
                (click)="closeWithdrawModal()">

                <i class="bi bi-x-lg"></i>

            </button>

        </div>

        <!-- Body -->

        <div class="modal-body">

            <form class="modal-form">

                <div class="form-group">

                    <label>Withdraw Amount</label>

                    <input
                        type="number"
                        class="form-control"
                        placeholder="Enter amount">

                </div>

                <div class="form-group">

                    <label>Withdrawal Date</label>

                    <input
                        type="date"
                        class="form-control">

                </div>

                <div class="form-group">

                    <label>Payment Method</label>

                    <select class="form-select">

                        <option>Bank Account</option>

                        <option>UPI</option>

                        <option>Wallet</option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Reference Number</label>

                    <input
                        type="text"
                        class="form-control"
                        placeholder="Optional">

                </div>

                <div class="form-group full-width">

                    <label>Notes</label>

                    <textarea
                        class="form-control"
                        rows="4"
                        placeholder="Reason for withdrawal...">
                    </textarea>

                </div>

            </form>

        </div>

        <!-- Footer -->

        <div class="modal-footer">

            <button
                type="button"
                class="btn btn-light"
                (click)="closeWithdrawModal()">

                Cancel

            </button>

            <button
                type="button"
                class="btn btn-danger">

                <i class="bi bi-arrow-up-right me-2"></i>

                Withdraw

            </button>

        </div>

    </div>

</div>

}
