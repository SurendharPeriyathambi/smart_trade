<section class="hero">
  <div class="hero-wrapper">

    <!-- Skeleton: shows while image decodes -->
    @if (!imageReady()) {
      <div class="hero-skeleton"></div>
    }

    <!-- Image: src set immediately, fades in when decoded -->
    @if (imageSrc()) {
      <img
        class="hero-img"
        [class.visible]="imageReady()"
        [src]="imageSrc()"
        fetchpriority="high"
        decoding="async"
        alt="Hero Banner"
      />
    }

  </div>
</section>
