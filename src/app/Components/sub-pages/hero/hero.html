<section class="hero">
  <div class="hero-wrapper"  [style.aspect-ratio]="bgAspectRatio()">  

     @if (!bgReady()) {
      <div class="hero-skeleton"></div>
    }

      <div
      class="hero-bg-img"
      [class.visible]="bgReady()"
      [style.background-image]="bgBannerSrc() ? 'url(' + bgBannerSrc() + ')' : null"
    ></div>

  </div>
</section>
