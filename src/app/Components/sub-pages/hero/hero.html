<section class="hero">
  <div class="hero-wrapper" [class.loading]="!bgReady()">

    @if (!bgReady()) {
      <div class="hero-skeleton"></div>
    }

    @if (bgBannerSrc()) {
      <img
        class="hero-bg-img"
        [class.visible]="bgReady()"
        [src]="bgBannerSrc()"
        alt="Hero banner"
        (load)="onHeroImageLoad()"
      />
    }

  </div>
</section>
