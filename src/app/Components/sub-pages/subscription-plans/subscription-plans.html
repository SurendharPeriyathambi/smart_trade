<div class="plans-wrapper" >
  <div class="div-box"></div>

  <div class="container text-center my-5 position-relative">

    <h2 class="fw-bold">Subscription</h2>
    <p class="text-muted">
      Choose the right plan to meet your <strong>Trading</strong> needs
    </p>

    

    <!-- Plans -->
    <div class="row g-4 justify-content-center align-items-stretch">

      @for (plan of plans(); track plan.id) {

      <div class="col-lg-4 col-md-6 col-12">
        <div class="pricing-card" [ngClass]="getPlanClass(plan.plan_name)">
          <div class="card-content  ">
            <h3 class="plan-name">{{ plan.plan_name }}</h3>
            <p class="plan-price">₹ {{ plan.amount }} / {{plan.duration}} {{plan.validity}} </p>

            @if (!isPending) {
            <button class="choose-btn" (click)="selectPlan(plan)">Choose</button>
            }
          </div>
        </div>
      </div> }

    </div>
  </div>
</div>
