<div class="weekly-videos container">

  <h3 class="section-title">Weekly Analysis</h3>
    
  <div class="videos-grid">
    <div class="video-card" *ngFor="let video of weeks()">

      <div class="video-thumbnail">
        <img [src]="video.thumbnail" [alt]="video.title">
        <button class="play-button" (click)="openVideo(video)">
          <svg width="36" height="36" viewBox="0 0 40 40">
            <circle cx="20" cy="20" r="20" fill="white" />
            <path d="M16 12L28 20L16 28V12Z" fill="#4361ee" />
          </svg>
        </button>
       
      </div>

      <h4 class="video-title">{{ video.title }}</h4>

    </div>
  </div>

</div>

<!-- ✅ VIDEO MODAL -->
<div class="video-modal" *ngIf="subService.isModalOpens()">

  <div class="overlay" (click)="closeVideo()"></div>

  <div class="modal-content">
    <button class="close-btn" (click)="closeVideo()">✕</button>

    <video #videoPlayer controls autoplay></video>
  </div>
</div>
