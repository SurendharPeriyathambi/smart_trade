<app-header [isAuthButton]="false" [showLogout]="true"/>

  <app-subscription-summary (renewalClicked)="openRenewalModal()"/> 

  <!--    FIX 3: Correct condition — hide entire plans section when active OR approved -->

  
  <app-subscription-plans
    *ngIf="subscriptionStatus() !== 'active' && subscriptionStatus() !== 'approved'"
    [status]="subscriptionStatus()" 
    (planSelected)="onPlanSelected($event)"/>

  <!-- Payment section: shown after choosing a plan, only when status is null/pending -->
  <div #paymentSectionRef>
    <!-- <app-payment-section
      *ngIf="selectedPlan && subscriptionStatus() !== 'active' && subscriptionStatus() !== 'approved'"
      [plan]="selectedPlan"
      (paymentDone)="onPaymentDone()"/> -->

      
  <app-coopen  *ngIf="selectedPlan && subscriptionStatus() !== 'active' && subscriptionStatus() !== 'approved'"
   [plan]="selectedPlan" (paymentDone)="onPaymentDone()" [isRenewal]="true"/>
  </div>

  <!--    FIX 3: Course shown only when active or approved -->
  <app-course-curriculam
    *ngIf="subscriptionStatus() === 'active' || subscriptionStatus() === 'approved'"/>

     <!-- <app-course-curriculam/> -->
<!-- <app-list-chart/> -->


<!-- Renewal Modal -->
<div class="renewal-modal-overlay" *ngIf="showRenewalModal()" (click)="closeRenewalModal()">
  <div class="renewal-modal" (click)="$event.stopPropagation()">
    <button class="renewal-modal-close" type="button" aria-label="Close" (click)="closeRenewalModal()">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
        <path d="M2.146 2.146a.5.5 0 0 1 .708 0L8 7.293l5.146-5.147a.5.5 0 1 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8 2.146 2.854a.5.5 0 0 1 0-.708z"/>
      </svg>
    </button>

    <div class="renewal-modal-body">
      <app-subscription-plans
        *ngIf="!renewalSelectedPlan()"
        [status]="null"
        (planSelected)="onRenewalPlanSelected($event)">
      </app-subscription-plans>

      <app-coopen
        *ngIf="renewalSelectedPlan()"
        [plan]="renewalSelectedPlan()"
        (paymentDone)="onRenewalPaymentDone()">
      </app-coopen>
    </div>
  </div>
</div>

<app-footer/>
