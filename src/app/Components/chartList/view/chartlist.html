<!-- <app-loading *ngIf="state.loading()"></app-loading> -->
<div class="chart-data">
  <!-- ── PAGE HEADER ── -->
  <div class="page-header" *ngFor="let item of chartDataList()">
    <div class="page-header__left">
      <h1 class="page-header__title">Mock Mentor</h1>
      <p class="page-header__sub">Manage and preview JSON market data files used for assessments.</p>
    </div>
  </div>
  <!-- ── CARD GRID ── -->
  <div class="card-grid">
  

    <div class="data-card" 
     *ngFor="let item of chartDataList; let i = index"
     >

  <!-- Card top row: badge + menu -->
  <div class="data-card__top">
    <span class="badge badge--forex " [style.background]="getCardColor(i)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="2" y1="12" x2="22" y2="12"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
      {{ item?.title }}
  </span>
      <div class="meta-col "> 
        <div class="hero-buttons">
<a  class="btn-secondary text-decoration-none desktop-only ms-auto" (click)="onChart($event,item)">
    <span class="icon"><i class="bi bi-bar-chart-fill me-2 fs-6"></i></span>
    Chart
  </a>
        </div>
 

</div>
  

  </div>


  <!-- <h3 class="data-card__filename">{{ item?.title }}</h3> -->
  <p class="data-card__desc">{{ item?.chart_title}}</p>

  <hr class="data-card__divider" />

  <div class="data-card__meta">
 
    @if(!item?.json_path){
      <div class="data-card__footer">
  

</div>
    }
    @else{


    }
    
  </div>

</div>

  </div>

</div>
